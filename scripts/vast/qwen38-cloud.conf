[program:qwen38-cloud]
command=/opt/supervisor-scripts/run-qwen38-cloud.sh
directory=/workspace/qwen38
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/qwen38-cloud.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=3
stderr_logfile=/var/log/portal/qwen38-cloud.err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=3
environment=CUDA_VISIBLE_DEVICES="0"
