[program:tailscaled-qwen]
command=/opt/supervisor-scripts/run-tailscaled.sh
directory=/workspace/qwen38
autostart=false
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/tailscaled-qwen.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile=/var/log/portal/tailscaled-qwen.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=2
