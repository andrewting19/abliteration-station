[program:qwen38-profile]
command=/opt/supervisor-scripts/run-qwen38-cloud.sh
directory=/workspace/qwen38
environment=CUDA_VISIBLE_DEVICES="0",QWEN38_SAMPLER_PROFILE_LIBRARY="/workspace/qwen38/benchmarks/sampler-profile/sampler_profile.so"
autostart=false
autorestart=false
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/qwen38-profile.out.log
stderr_logfile=/var/log/portal/qwen38-profile.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
