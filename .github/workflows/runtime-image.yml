name: Runtime image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Artifact to build
        type: choice
        default: image
        options: [image, cuda-iq-mmq, q4-mma-tile]
  push:
    branches: [main]
    paths:
      - images/runtime/**
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'image'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - name: Free build disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: image_tags
        run: |
          {
            echo 'tags<<IMAGE_TAGS'
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo ghcr.io/andrewting19/abliteration-station-runtime:cuda13.2-v6
              echo ghcr.io/andrewting19/abliteration-station-runtime:latest
            else
              echo "ghcr.io/andrewting19/abliteration-station-runtime:candidate-${GITHUB_SHA}"
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build_image
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64
          # Keep unchanged model layers stable across runtime-only updates.
          build-args: SOURCE_DATE_EPOCH=0
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          tags: ${{ steps.image_tags.outputs.tags }}
      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST"
  check_host_keys:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Free image-test disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Check fresh and retained SSH host keys
        env:
          IMAGE: ghcr.io/andrewting19/abliteration-station-runtime@${{ needs.publish.outputs.digest }}
        run: bash benchmarks/check_image_host_keys.sh "$IMAGE"
  cuda_iq_mmq:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cuda-iq-mmq'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Free compiler disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build baseline and experimental CUDA libraries
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            nvidia/cuda@sha256:f9492f2eea77fbc3d0c14fa8738f35946b42da72917bf5959d284ca39b4f209a \
            bash -lc 'apt-get update && apt-get install -y --no-install-recommends git cmake ninja-build build-essential libssl-dev ca-certificates && bash benchmarks/build_iq_mmq_candidate.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: iq-mmq-candidate
          path: dist/iq-mmq-candidate
          retention-days: 3
          if-no-files-found: error
  q4_mma_tile:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'q4-mma-tile'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Compile isolated Q4 attention tile probe
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            nvidia/cuda@sha256:f9492f2eea77fbc3d0c14fa8738f35946b42da72917bf5959d284ca39b4f209a \
            bash -lc 'apt-get update && apt-get install -y --no-install-recommends git build-essential ca-certificates && bash benchmarks/build_q4_mma_tile_probe.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: q4-mma-tile-probe
          path: dist/q4-mma-tile-probe
          retention-days: 3
          if-no-files-found: error
