name: Runtime image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/runtime/**
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Free build disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: image_tags
        run: |
          {
            echo 'tags<<IMAGE_TAGS'
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo ghcr.io/andrewting19/abliteration-station-runtime:cuda13.2-v6
              echo ghcr.io/andrewting19/abliteration-station-runtime:latest
            else
              echo "ghcr.io/andrewting19/abliteration-station-runtime:candidate-${GITHUB_SHA}"
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build_image
        with:
          context: .
          file: images/runtime/Dockerfile
          platforms: linux/amd64
          # Keep unchanged model layers stable across runtime-only updates.
          build-args: SOURCE_DATE_EPOCH=0
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          tags: ${{ steps.image_tags.outputs.tags }}
      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'IMAGE_DIGEST=%s\n' "$IMAGE_DIGEST"
